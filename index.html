<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Portfolio">
  <title>! e r N E</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/avatar.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── BACKGROUND MEDIA ── -->
  <div id="bg-media">
    <!--
      FOTOĞRAF için: src="" kısmına assets/img/ altındaki dosya adını yaz
      VIDEO için: aşağıdaki video bloğunu yorumdan çıkar, img'i yorum yap
    -->
    <img src="https://i.pinimg.com/736x/5d/87/d2/5d87d22a9992b5803bc69be7f7570a27.jpg" alt="" id="bg-image">

    <!--
    <video autoplay muted loop playsinline id="bg-video">
      <source src="assets/video/bg.mp4" type="video/mp4">
    </video>
    -->
  </div>
  <div class="bg-overlay"></div>

  <!-- ── APP ── -->
  <div id="app">

    <!-- PROFILE -->
    <section class="profile-section">
      <div class="avatar-wrap">
        <!-- AVATAR: assets/img/avatar.png olarak koy, veya URL yaz -->
        <img src="assets/img/avatar.png" alt="avatar" id="avatar-img"
             onerror="this.src='https://api.dicebear.com/9.x/shapes/svg?seed=noir&backgroundColor=0a0a0a'">
        <div class="avatar-status-dot" id="avatar-dot"></div>
      </div>
      <h1 class="profile-name" id="profile-name"><!-- config.js --></h1>
      <p class="profile-bio" id="profile-bio"><!-- config.js --></p>
    </section>

    <!-- DISCORD STATUS -->
    <div id="discord-status">
      <div class="status-badge" id="status-badge">
        <span class="status-icon">🌙</span>
        <span id="status-text">Boşta</span>
      </div>
    </div>

    <!-- MUSIC PLAYER — Spotify Only -->
    <div class="music-player" id="music-player">
      <div class="player-header">
        <span class="player-label">▸ now playing</span>
      </div>
      <iframe id="spotify-iframe"
        src="" width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy" style="border-radius:12px; display:block;">
      </iframe>
    </div>

    <!-- PROJECTS -->
    <span class="section-label">projeler</span>
    <div class="projects-grid" id="projects-grid">
      <!-- config.js tarafından doldurulur -->
    </div>

    <!-- SOCIALS -->
    <div class="socials" id="socials">
      <!-- config.js tarafından doldurulur -->
    </div>

    <p class="footer">Tüm haklar saklıdır @erNE · 2026</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
